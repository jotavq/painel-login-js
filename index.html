<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel De LOGIN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Painel</h1>
</header>

<section>
    <div id="login" class="login-box">
        <h2>Login</h2>

        <div class="input-box">
            <input type="email" name="txemail" id="txemail" required placeholder="">
            <label>Email</label>
        </div>

        <div class="input-box">
            <input type="password" name="txsenha" id="txsenha" required placeholder="">
            <label>Senha</label>
        </div>

        <div class="options">
            <label>
                <input type="checkbox" id="lembrar" onchange="lembrarSenha()"> Lembrar
            </label>
            <a href="#" onclick="esqueciSenha()">Esqueceu a senha?</a>
        </div>

        <input type="button" value="Entrar" class="btn" onclick="entrar()">

        <div id="res"></div>

        <p class="register">
            Não tem uma conta ? <a href="#" onclick="registrar()">Registrar</a>
        </p>
    </div>
</section>

<footer>
    <p>&copy; Painel de login</p>
</footer>

<script src="script.js"></script>

</body>
</html>
